<style>

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit}

  .brand{display:flex;align-items:center;gap:10px}
  .sun{position:relative;width:30px;height:30px;flex:none}
  .sun .disc{position:absolute;inset:7px;border-radius:50%;background:var(--accent)}
  .sun .ray{position:absolute;left:50%;top:50%;width:2px;height:5px;margin:-2.5px 0 0 -1px;border-radius:3px;background:var(--accent)}
  .brand b{font-family:'Josefin Sans',var(--sans);font-weight:700;font-size:18px;letter-spacing:.02em}
  .brand small{display:block;font-size:9.5px;letter-spacing:.26em;color:var(--accent-2);font-weight:700;margin-top:1px}
  .top .sp{flex:1}
  .top .rec{font:600 12px var(--sans);color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:9px;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
  .top .rec b{color:var(--ink)}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:600 12.5px var(--sans);padding:9px 13px;border-radius:9px;display:inline-flex;gap:6px;align-items:center;transition:.15s}
  .btn:hover{border-color:var(--line-2)}
  .btn--go{background:var(--accent);border-color:var(--accent);color:#fff}.btn--go:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn svg{width:14px;height:14px}
  .wrap{display:grid;grid-template-columns:352px 1fr;height:calc(100% - 55px)}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
  .form{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
  .tabs{display:flex;gap:2px;padding:8px 10px 0;position:sticky;top:0;background:var(--panel);z-index:5;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;cursor:pointer;border:0;background:none;color:var(--muted);font:700 11px var(--sans);padding:9px 4px;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .pane{display:none;padding:16px 16px 60px}.pane.on{display:block}
  .grp{margin-bottom:20px}.grp>label{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px}
  .field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input[type=text],.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:500 13px var(--sans);padding:9px 11px;outline:none}
  .field textarea{resize:vertical;min-height:64px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .col{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
  .col input[type=color]{width:26px;height:26px;border:0;background:none;padding:0;cursor:pointer;border-radius:6px;flex:none}
  .col input[type=text]{border:0;background:none;color:var(--ink);font:600 12px var(--mono);width:100%;text-transform:uppercase;outline:none;padding:0}
  .col span{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .col .clr{cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
  .seg button{flex:1;cursor:pointer;border:0;background:none;color:var(--muted);font:600 12px var(--sans);padding:7px 4px;border-radius:7px}
  .seg button.on{background:var(--accent);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:600 11.5px var(--sans);padding:6px 11px;border-radius:999px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:7px}
  .secpills{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.secpills span{font:600 10px var(--mono);color:var(--accent-2);background:rgba(255,87,34,.1);border:1px solid rgba(255,87,34,.25);padding:3px 8px;border-radius:6px}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
  .toggle .l{font-size:12.5px;font-weight:600}.toggle .l small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  .sw{width:40px;height:23px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:.25s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s}
  .sw.on{background:var(--accent)}.sw.on::after{transform:translateX(17px)}
  .area{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden;background:var(--panel-2)}
  .area__h{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer}
  .area__h .nm{flex:1;font-size:12.5px;font-weight:600;text-transform:capitalize}
  .area__h .ca{font-size:11px;color:var(--muted)}
  .area__b{display:none;padding:0 11px 11px;border-top:1px solid var(--line)}
  .area.open .area__b{display:block}.area__b .field:first-child{margin-top:10px}
  .prompt{background:linear-gradient(180deg,rgba(255,87,34,.09),rgba(255,87,34,.02));border:1px solid var(--accent);border-radius:12px;padding:12px}
  .prompt textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:500 13px var(--sans);padding:10px;min-height:70px;resize:vertical;outline:none}
  .prompt textarea:focus{border-color:var(--accent)}
  .prompt .row{display:flex;gap:8px;margin-top:9px;align-items:center}
  .prompt .ex{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.6}
  .prompt .ex b{color:var(--accent-2);cursor:pointer;font-weight:600}
  .stage{position:relative;background:#06080c;overflow:hidden;display:flex;flex-direction:column}
  .stagebar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .stagebar i{width:10px;height:10px;border-radius:50%;background:#2f313c}
  .stagebar .url{margin-left:6px;font:500 11px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 12px;flex:1;max-width:320px}.stagebar .url b{color:var(--ink)}
  .frame{flex:1;border:0;width:100%;background:#fff}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#0B0E13;font-weight:700;font-size:13px;padding:11px 18px;border-radius:11px;box-shadow:0 20px 50px -18px #000;transition:.25s;z-index:80;max-width:80vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

/* ---- colour helpers ---- */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function readable(h,bg){let c=h;for(let i=0;i<14;i++){const L1=lum(c),L2=lum(bg);const cr=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);if(cr>=4.4)break;c=mix(c,lum(bg)>.5?'#000000':'#ffffff',.1);}return c;}

  const accentInk=readable(A,cream),act=S.action||A,act2=mix(act,'#ffffff',.28);
  return {A,A2,act,act2,cream,cream2,card,line,ink,body,muted,accentInk,darkBand:dark?'#070A12':'#141824',onDark:'#EEF1F8',onDarkMut:'#9AA2B4',lineDark:'#232A3A'};
}

function activeSections(){return RECIPES[S.ind].sections.filter(s=>!S.hidden[s]);}
function motionClass(){return Object.keys(S.motions).filter(k=>S.motions[k]).map(k=>'m-'+k).join(' ');}
function buildPage(){
  const c=cp(),t=tokens();
  const tv=`--accent:${t.A};--accent-2:${t.A2};--accent-ink:${t.accentInk};--act:${t.act};--act2:${t.act2};--cream:${t.cream};--cream-2:${t.cream2};--card:${t.card};--line:${t.line};--ink:${t.ink};--body:${t.body};--muted:${t.muted};--darkBand:${t.darkBand};--onDark:${t.onDark};--onDarkMut:${t.onDarkMut};--lineDark:${t.lineDark};--fh:'${S.fh}';--fb:'${S.fb}';--radius:${S.radius}`;
  const body=activeSections().map(s=>B[s]?B[s](c):'').join('\n');
  const cu=S.motions.countup?"document.querySelectorAll('.cnt').forEach(function(el){var raw=el.textContent,m=raw.match(/^(\\D*)([\\d.,]+)(.*)$/);if(!m)return;var pre=m[1],suf=m[3],tg=parseFloat(m[2].replace(/,/g,''));function go(){var t0=null;requestAnimationFrame(function f(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1300);el.textContent=pre+Math.round((1-Math.pow(1-p,3))*tg)+suf;if(p<1)requestAnimationFrame(f);else el.textContent=raw;});}new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){go();this.disconnect&&this.disconnect();}})},{threshold:.4}).observe(el);});":"";
  const rv="var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12});document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});";
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?${FONT_QUERY}&display=swap"><style>:root{${tv}}${ENGINE}</style></head><body class="${motionClass()}">${body}<script>${rv}${cu}<\/script></body></html>`;
}

const frame=document.getElementById('frame');let rt;
function render(){clearTimeout(rt);rt=setTimeout(()=>{frame.srcdoc=buildPage();const slug=(S.name||'brand').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'brand';document.getElementById('url').textContent=slug;document.getElementById('rec').innerHTML='<b>'+RECIPES[S.ind].label+'</b> · '+activeSections().length+' sections';},120);}

/* ---- sync form ---- */
function applyIndustry(k,keepBrand){const r=RECIPES[k];S.ind=k;if(!keepBrand){S.accent=r.accent;S.action=r.action;S.lead=r.lead;S.fh=r.fontHead;S.fb=r.fontBody;S.radius=r.radius;S.bg={cream:"",cream2:"",card:"",ink:"",body:"",line:""};S.hidden={};S.copy={};}
  document.getElementById('ind-vibe').textContent="Recommended: "+r.vibe+" · "+(r.lead==='dark'?'dark-led':'light-led')+" · "+r.sections.length+" sections.";
  document.getElementById('ind-sections').innerHTML=r.sections.map(s=>'<span>'+s+'</span>').join('');}
function syncForm(){
  document.getElementById('f-name').value=S.name;document.getElementById('f-tag').value=S.tag;document.getElementById('f-init').value=S.init;
  indSel.value=S.ind;document.getElementById('f-acc-c').value=S.accent;document.getElementById('f-acc-t').value=S.accent;
  document.getElementById('f-act-c').value=S.action||S.accent;document.getElementById('f-act-t').value=S.action;
  document.getElementById('f-fh').value=S.fh;document.getElementById('f-fb').value=S.fb;
  document.querySelectorAll('#seg-theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lead));
  document.querySelectorAll('#seg-radius button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.radius));
  BGF.forEach(([k])=>{const c=document.querySelector('[data-bgc="'+k+'"]'),t=document.querySelector('[data-bgt="'+k+'"]');t.value=S.bg[k]||'';if(S.bg[k])c.value=S.bg[k];});
  document.querySelectorAll('#motions .sw').forEach(b=>b.classList.toggle('on',!!S.motions[b.dataset.m]));
  buildAreas();
}
function buildAreas(){
  const c=cp();const EF={
    hero:[['hero.eyebrow','Eyebrow',c.eyebrow],['hero.l1','Headline line 1',c.l1],['hero.l2','Headline line 2 (accent)',c.l2],['hero.sub','Subheading',c.sub],['hero.cta1','Primary button',c.cta1],['hero.cta2','Secondary button',c.cta2]],
    trust:(c.trust||GENERIC.trust).map((x,i)=>['trust.'+i,'Pill '+(i+1),x]),
    features:(c.features||[]).flatMap((f,i)=>[['feature.'+i+'.t','Feature '+(i+1)+' title',f[1]],['feature.'+i+'.x','Feature '+(i+1)+' text',f[2]]]),
    stats:(c.stats||[]).flatMap((x,i)=>[['stat.'+i+'.b','Stat '+(i+1)+' number',x[0]],['stat.'+i+'.l','Stat '+(i+1)+' label',x[1]]]),
    steps:(c.steps||[]).flatMap((x,i)=>[['step.'+i+'.t','Step '+(i+1)+' title',x[0]],['step.'+i+'.x','Step '+(i+1)+' text',x[1]]]),
    testimonials:(c.testimonials||GENERIC.testimonials).flatMap((x,i)=>[['tst.'+i+'.q','Quote '+(i+1),x[0]],['tst.'+i+'.by','Author '+(i+1),x[1]]]),
    cta:[['cta.title','CTA title',(c.cta||[])[0]],['cta.sub','CTA subtext',(c.cta||[])[1]],['cta.btn','CTA button',(c.cta||[])[2]]]
  };
  const host=document.getElementById('areas');
  host.innerHTML=RECIPES[S.ind].sections.map(sec=>{
    const on=!S.hidden[sec];const fields=EF[sec]||[];
    const rows=fields.map(([p,l,d])=>`<div class="field"><label>${l}</label><input type="text" data-copy="${p}" value="${(T(p,d)||'').replace(/"/g,'&quot;')}"></div>`).join('');
    return `<div class="area" data-sec="${sec}"><div class="area__h"><button class="sw ${on?'on':''}" data-hide="${sec}"></button><span class="nm">${sec}</span>${fields.length?'<span class="ca" data-toggle>▸ edit</span>':'<span class="ca" style="opacity:.4">—</span>'}</div>${fields.length?'<div class="area__b">'+rows+'</div>':''}</div>`;
  }).join('');
}

/* ---- events ---- */
const on=(id,ev,fn)=>document.getElementById(id).addEventListener(ev,fn);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.t));});
on('f-name','input',e=>{S.name=e.target.value;render();});
on('f-tag','input',e=>{S.tag=e.target.value;render();});
on('f-init','input',e=>{S.init=e.target.value.toUpperCase()||'A';render();});
on('f-ind','change',e=>{applyIndustry(e.target.value,false);syncForm();render();});
on('f-acc-c','input',e=>{S.accent=e.target.value.toUpperCase();document.getElementById('f-acc-t').value=S.accent;render();});
on('f-acc-t','change',e=>{const v=e.target.value.trim();if(/^#?[0-9a-fA-F]{6}$/.test(v)){S.accent=(v[0]==='#'?v:'#'+v).toUpperCase();document.getElementById('f-acc-c').value=S.accent;render();}});
on('f-act-c','input',e=>{S.action=e.target.value.toUpperCase();document.getElementById('f-act-t').value=S.action;render();});
on('f-act-t','change',e=>{const v=e.target.value.trim();if(v===''){S.action='';render();}else if(/^#?[0-9a-fA-F]{6}$/.test(v)){S.action=(v[0]==='#'?v:'#'+v).toUpperCase();render();}});
on('f-fh','change',e=>{S.fh=e.target.value;render();});
on('f-fb','change',e=>{S.fb=e.target.value;render();});
document.querySelectorAll('#seg-theme button').forEach(b=>b.onclick=()=>{S.lead=b.dataset.v;syncForm();render();});
document.querySelectorAll('#seg-radius button').forEach(b=>b.onclick=()=>{S.radius=b.dataset.v;syncForm();render();});
/* bg pickers */
document.querySelectorAll('[data-bgc]').forEach(c=>c.addEventListener('input',e=>{const k=e.target.dataset.bgc;S.bg[k]=e.target.value.toUpperCase();document.querySelector('[data-bgt="'+k+'"]').value=S.bg[k];render();}));
document.querySelectorAll('[data-bgt]').forEach(t=>t.addEventListener('change',e=>{const k=e.target.dataset.bgt,v=e.target.value.trim();if(v===''){S.bg[k]='';render();}else if(/^#?[0-9a-fA-F]{6}$/.test(v)){S.bg[k]=(v[0]==='#'?v:'#'+v).toUpperCase();render();}}));
/* clears */
document.querySelectorAll('[data-clr]').forEach(x=>x.onclick=()=>{const w=x.dataset.clr;if(w==='action'){S.action='';}else if(w.startsWith('bg-')){S.bg[w.slice(3)]='';}syncForm();render();});
/* motion toggles */
document.querySelectorAll('#motions .sw').forEach(b=>b.onclick=()=>{S.motions[b.dataset.m]=!S.motions[b.dataset.m];b.classList.toggle('on',S.motions[b.dataset.m]);render();});
/* areas: hide toggles, expand, copy edits (delegated) */
document.getElementById('areas').addEventListener('click',e=>{
  const hide=e.target.closest('[data-hide]');if(hide){const s=hide.dataset.hide;S.hidden[s]=!S.hidden[s];hide.classList.toggle('on',!S.hidden[s]);render();return;}
  const tg=e.target.closest('[data-toggle]');if(tg){tg.closest('.area').classList.toggle('open');}
});
document.getElementById('areas').addEventListener('input',e=>{const el=e.target.closest('[data-copy]');if(el){S.copy[el.dataset.copy]=el.value;render();}});

/* copy + surprise */
const toast=document.getElementById('toast');
function say(m){toast.textContent=m;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1700);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>say(msg)).catch(fb);else fb();function fb(){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();say(msg);}}
on('copycss','click',()=>copy(brandCss(),'brand.css copied'));
on('copyhtml','click',()=>copy(buildPage(),'Full site HTML copied'));
const PALS=["#FF5722","#1E9E6A","#5B5BFF","#7C4DFF","#FF2E88","#F5A623","#0EA5E9","#E11D48","#8A6D3B","#C0392B"];
on('surprise','click',()=>{S.accent=PALS[Math.floor(Math.random()*PALS.length)];S.bg={cream:"",cream2:"",card:"",ink:"",body:"",line:""};syncForm();render();});

/* ---- AI prompt (sample capability) ---- */
document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{document.getElementById('ai-in').value=b.dataset.ex;});
on('ai-go','click',async ()=>{
  const input=document.getElementById('ai-in').value.trim();if(!input)return;
  const lbl=document.getElementById('ai-lbl'),note=document.getElementById('ai-note');
  lbl.innerHTML='<span class="spin"></span>';note.textContent='';
  let sample=null;try{sample=await claude.use('sample');}catch(e){}
  if(!sample){lbl.textContent='Apply change';note.textContent='The AI prompt needs the sample capability — not available in this view. Use the manual controls instead.';return;}
  const state={name:S.name,tag:S.tag,industry:S.ind,accent:S.accent,action:S.action,lead:S.lead,fontHead:S.fh,fontBody:S.fb,radius:S.radius,bg:S.bg,motions:S.motions,hidden:S.hidden,copy:S.copy};
  const instr="You edit the state of a website builder. Return ONLY a JSON object with the keys that should change (a patch), nothing else.\n"+
    "Valid keys: name, tag (strings); industry (one of "+Object.keys(RECIPES).join(', ')+"); accent, action (hex like #1122FF, action can be '' for none); lead ('light'|'dark'); fontHead, fontBody (one of "+FONTS.join(', ')+"); radius ('6px'|'16px'|'26px'); "+
    "bg (object, any of cream,cream2,card,ink,body,line as hex to override backgrounds/text, '' to clear); "+
    "motions (object, any of reveal,glow,gradient,shimmer,countup,float as true/false); "+
    "hidden (object, section name -> true to remove a section; sections: nav,hero,trust,features,stats,steps,pricing,testimonials,logos,cta,footer); "+
    "copy (object, path->text to rewrite copy; paths e.g. hero.eyebrow, hero.l1, hero.l2, hero.sub, hero.cta1, cta.title, cta.sub, cta.btn, feature.0.t, feature.0.x, stat.0.b, stat.0.l, trust.0, tst.0.q).\n"+
    "Current state: "+JSON.stringify(state)+"\nUser request: "+input+"\nReturn only the JSON patch.";
  try{
    const patch=await sample.json([{role:'user',content:instr}],{modelTier:'default'});
    if(patch&&typeof patch==='object'){
      if(patch.industry&&RECIPES[patch.industry]&&patch.industry!==S.ind){applyIndustry(patch.industry,true);}
      ['name','tag','accent','action','lead','radius'].forEach(k=>{if(patch[k]!=null)S[k]=patch[k];});
      if(patch.fontHead)S.fh=patch.fontHead;if(patch.fontBody)S.fb=patch.fontBody;
      if(patch.bg&&typeof patch.bg==='object')Object.assign(S.bg,patch.bg);
      if(patch.motions&&typeof patch.motions==='object')Object.assign(S.motions,patch.motions);
      if(patch.hidden&&typeof patch.hidden==='object')Object.assign(S.hidden,patch.hidden);
      if(patch.copy&&typeof patch.copy==='object')Object.assign(S.copy,patch.copy);
      applyIndustry(S.ind,true);syncForm();render();say('Applied');
    } else { note.textContent='Could not read that change — try rephrasing.'; }
  }catch(err){note.textContent=(err&&err.code==='rate_limited')?'Rate limited — try again in a moment.':'Could not apply that change.';}
  lbl.textContent='Apply change';
});

applyIndustry(S.ind,true);syncForm();render();
</script>
