<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMNIV — Paste-and-Go Starter</title>

<!-- Fonts (optional — remove and the system font kicks in) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  /* =========================================================================
     BRAND TOKENS — the only thing you change to reskin every component.
     Every library snippet reads these (var(--accent), var(--card), …) and
     already carries a fallback, so it looks right even if you delete a line.
     Change the 4 accent values + the neutrals and the whole page reskins.
     ========================================================================= */
  :root {
    /* accent */
    --accent:      #FF5722;   /* the one bold colour: buttons, active, chips */
    --accent-2:    #FF9466;   /* lighter end of gradients                    */
    --accent-ink:  #BE4018;   /* accent as text on a LIGHT ground            */
    --action:      var(--accent);  /* optional 2nd colour for primary buttons */

    /* neutrals — dark theme (this page leads dark) */
    --bg:    #0B0E13;   /* page ground        */
    --panel: #0F131A;   /* alternate section  */
    --card:  #171B22;   /* raised surface     */
    --card2: #20252E;   /* nested surface     */
    --line:  #262C34;   /* hairline borders   */
    --ink:   #F4F6F9;   /* headings / strong text */
    --body:  #B6BDC8;   /* body copy          */
    --muted: #8A93A2;   /* captions           */

    --radius: 16px;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  /* Light theme — flip <html data-theme="light"> to use it. */
  :root[data-theme="light"] {
    --bg:#FFFDFB; --panel:#FBF7F4; --card:#FFFFFF; --card2:#F5F0EC;
    --line:#EAE3DD; --ink:#1A1714; --body:#4A433E; --muted:#8A817A;
    --accent-ink:#BE4018;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  img { max-width: 100%; }

  /* ---- page scaffold (delete this block once you've filled the page) ---- */
  .om-guide {
    max-width: 820px; margin: 0 auto; padding: 40px 24px 8px;
  }
  .om-guide .kicker {
    display:inline-block; font: 700 11px/1 var(--mono); letter-spacing:.24em;
    color: var(--accent-2); text-transform: uppercase; margin-bottom: 14px;
  }
  .om-guide h1 { margin: 0 0 10px; font: 800 30px/1.1 var(--sans); letter-spacing:-.02em; }
  .om-guide p  { margin: 0 0 8px; color: var(--body); font-size: 14px; }
  .om-guide code {
    font: 600 12.5px var(--mono); background: var(--card); border:1px solid var(--line);
    padding: 2px 6px; border-radius: 6px; color: var(--accent-2);
  }
  .om-slot {
    margin: 26px auto 60px; max-width: 1080px; padding: 0 24px;
    display: grid; gap: 40px;
  }
  /* a dashed drop-zone so you can see where to paste; remove when you go live */
  .om-dropzone {
    border: 1.5px dashed var(--line); border-radius: var(--radius);
    min-height: 160px; display: grid; place-items: center;
    color: var(--muted); font: 500 13px var(--sans); text-align: center;
    padding: 30px;
  }
</style>
</head>

<body>

  <!-- ======================================================================
       HOW TO USE
       1. Open the library, click COPY on any component.
       2. Paste the snippet inside <main class="om-slot"> …HERE… </main> below.
       3. Save, open this file in a browser. That's it — no install, no build.
       4. To reskin: change the accent + neutral values in the :root block above.
       5. Delete the <header class="om-guide"> and .om-dropzone once you're set.
       ====================================================================== -->

  <header class="om-guide">
    <span class="kicker">OMNIV Engine</span>
    <h1>Paste-and-go starter</h1>
    <p>Copy any component from the library and drop it into <code>&lt;main class="om-slot"&gt;</code> below.</p>
    <p>No React, no npm, no build. Reskin the whole page from the <code>:root</code> tokens at the top of this file.</p>
  </header>

  <main class="om-slot">

    <!-- ▼▼▼  PASTE COMPONENTS HERE  ▼▼▼ -->

    <div class="om-dropzone">
      Paste a component here.<br>
      (This dashed box is just a guide — delete it.)
    </div>

    <!-- ▲▲▲  PASTE COMPONENTS HERE  ▲▲▲ -->

  </main>

  <!-- ======================================================================
       ONE-CLICK MOTION (optional)
       Uncomment the two lines below and put omniv-motion.css / .js next to
       this file. Then add classes/data-attributes like om-shimmer,
       data-om-reveal, data-om-count to ANY element and it auto-animates.
       See engine/motion/README.md for the full list.
       ====================================================================== -->
  <!-- <link rel="stylesheet" href="motion/omniv-motion.css"> -->
  <!-- <script src="motion/omniv-motion.js" defer></script> -->

</body>
</html>
