<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <title>Goodwork — Build better. Launch faster.</title>

    <!-- Site-level defaults, so link previews still work for scrapers that
         don't run JavaScript (Slack, WhatsApp, LinkedIn and most of the rest).
         Once React mounts, <Seo> removes everything marked data-gw-default and
         renders the real per-page metadata in its place — otherwise a crawler
         that does run JS would see two of each. -->
    <meta
      data-gw-default
      name="description"
      content="Production-ready websites, AI agents and business systems. Use the tools yourself, or let Goodwork build the complete operation for you."
    />
    <meta data-gw-default property="og:type" content="website" />
    <meta data-gw-default property="og:site_name" content="Goodwork" />
    <meta data-gw-default property="og:title" content="Goodwork — Build better. Launch faster." />
    <meta
      data-gw-default
      property="og:description"
      content="Production-ready websites, AI agents and business systems. Use the tools yourself, or let Goodwork build the complete operation for you."
    />
    <meta data-gw-default property="og:url" content="https://goodwork.agency/" />
    <meta data-gw-default property="og:image" content="https://goodwork.agency/og.png" />
    <meta data-gw-default property="og:image:width" content="1200" />
    <meta data-gw-default property="og:image:height" content="630" />
    <meta data-gw-default property="og:locale" content="en_GB" />
    <meta data-gw-default name="twitter:card" content="summary_large_image" />
    <meta data-gw-default name="twitter:image" content="https://goodwork.agency/og.png" />

    <!-- Preload hints for the above-the-fold font weights are injected at
         build time by the gw-preload-critical-fonts plugin in vite.config.js,
         because Vite hashes the filenames. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: Poppins, Helvetica, Arial, sans-serif; background:#0a0b0e; color:#f4f0e8; min-height:100vh">
        <h1>Goodwork — Build better. Launch faster.</h1>
        <p>Production-ready websites, AI agents and business systems. Library £280 one-time, Studio £888 one-time, Built by Goodwork £2,800, Embedded CRM £1,888, Agency programme £8,888.88.</p>
        <p>
          This site needs JavaScript. Email
          <a href="mailto:hello@goodwork.agency">hello@goodwork.agency</a> and we'll come straight
          back to you.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
